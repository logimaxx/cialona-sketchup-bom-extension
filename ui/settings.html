<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.4 "Segoe UI", sans-serif; margin: 0; padding: 16px; background: #f0f2f5; }
    h2 { margin: 0 0 16px; font-size: 16px; }
    .step { margin-bottom: 20px; }
    .step-title { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
    .field input[type="url"], .field input[type="text"] { width: 100%; max-width: 400px; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
    .field input[type="checkbox"] { margin-right: 6px; }
    .actions { margin-top: 20px; display: flex; gap: 8px; align-items: center; }
    .btn { padding: 8px 16px; cursor: pointer; border: none; border-radius: 4px; font-size: 13px; }
    .btn-save { background: #2171b8; color: #fff; }
    .btn-save:hover { background: #1a5a94; }
    .btn-cancel { background: #e0e0e0; color: #333; }
    .btn-cancel:hover { background: #d0d0d0; }
    .message { margin-top: 12px; font-size: 12px; color: #2d7d2d; }
    .message.error { color: #b00; }
  </style>
  <title>Plugin Settings</title>
</head>
<body>
  <h2>Plugin Settings 1</h2>
  <div class="step">
    <div class="step-title">FileMaker import API</div>
    <div class="field">
      <label for="import_api_url">API URL</label>
      <input type="url" id="import_api_url" placeholder="https://example.com/receiver/..." />
    </div>
    <div class="field">
      <label for="import_api_key">API Key</label>
      <input type="text" id="import_api_key" placeholder="API key" autocomplete="off" />
    </div>
  </div>
  <div class="step">
    <div class="step-title">Catalog (product search) API</div>
    <div class="field">
      <label for="catalog_api_url">Catalog API URL</label>
      <input type="url" id="catalog_api_url" placeholder="https://example.com/query_products" />
    </div>
    <div class="field">
      <label for="catalog_api_key">Catalog API Key</label>
      <input type="text" id="catalog_api_key" placeholder="API key" autocomplete="off" />
    </div>
    <div class="field">
      <label class="checkbox-label">
        <input type="checkbox" id="catalog_validate_codes" checked />
        <span>Validate product codes against catalog (recommended)</span>
      </label>
    </div>
  </div>
  <div class="actions">
    <button type="button" class="btn btn-save" id="btn-save" onclick="saveSettings()">Save</button>
    <button type="button" class="btn btn-cancel" id="btn-cancel" onclick="closeDialog()">Cancel</button>
  </div>
  <p class="message" id="message" style="display: none;"></p>

  <script>
    window.onSettingsLoaded = function(data) {
      if (!data) return;
      var el = document.getElementById("import_api_url");
      if (el && data.import_api_url != null) el.value = data.import_api_url || "";
      el = document.getElementById("import_api_key");
      if (el && data.import_api_key != null) el.value = data.import_api_key || "";
      el = document.getElementById("catalog_api_url");
      if (el && data.catalog_api_url != null) el.value = data.catalog_api_url || "";
      el = document.getElementById("catalog_api_key");
      if (el && data.catalog_api_key != null) el.value = data.catalog_api_key || "";
      el = document.getElementById("catalog_validate_codes");
      if (el) el.checked = data.catalog_validate_codes !== false && data.catalog_validate_codes !== "false";
    };

    function saveSettings() {
      var msgEl = document.getElementById("message");
      if (typeof sketchup === "undefined" || !sketchup.save_settings) {
        msgEl.textContent = "Plugin bridge not available.";
        msgEl.className = "message error";
        msgEl.style.display = "block";
        return;
      }
      var importApiUrl = document.getElementById("import_api_url").value.trim();
      var importApiKey = document.getElementById("import_api_key").value.trim();
      var catalogApiUrl = document.getElementById("catalog_api_url").value.trim();
      var catalogApiKey = document.getElementById("catalog_api_key").value.trim();
      var catalogValidateCodes = document.getElementById("catalog_validate_codes").checked;
      console.log("catalogValidateCodes: ", catalogValidateCodes);
      var payload = { import_api_url: importApiUrl, import_api_key: importApiKey, catalog_api_url: catalogApiUrl, catalog_api_key: catalogApiKey, catalog_validate_codes: catalogValidateCodes };
      try {
        var b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
        sketchup.save_settings(b64);
      } catch (e) {
        msgEl.textContent = "Failed to encode settings: " + (e.message || e);
        msgEl.className = "message error";
        msgEl.style.display = "block";
      }
      //closeDialog();
    }

    window.onSettingsSaved = function(data) {
      var msgEl = document.getElementById("message");
      msgEl.style.display = "block";
      if (data && data.error) {
        msgEl.textContent = data.message || "Save failed.";
        msgEl.className = "message error";
      } else {
        msgEl.textContent = "Settings saved.";
        msgEl.className = "message";
      }
    };

    function closeDialog() {
      if (typeof sketchup !== "undefined" && sketchup.close_dialog) sketchup.close_dialog();
    }

    (function init() {
      function loadSettings() {
        if (typeof sketchup !== "undefined" && sketchup.get_settings) sketchup.get_settings();
      }
      if (typeof sketchup !== "undefined" && sketchup.get_settings) loadSettings();
      else setTimeout(loadSettings, 100);
    })();
  </script>
</body>
</html>
